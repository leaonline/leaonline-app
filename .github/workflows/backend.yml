name: Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lintcode:
    name: Backend JS lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - run: cd src && npm ci --legacy-peer-deps --force
      - run: cd src && npm run lint:code

  tests:
    name: Backend Meteor Tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout leaonline:corelib repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/corelib
          path: github/corelib


      - name: Checkout leaonline:service-registry repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/service-registry
          path: github/service-registry

      # CACHING
      - name: Install Meteor
        id: cache-meteor-install
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: v3-meteor-${{ hashFiles('.meteor/versions') }}
          restore-keys: |
            v3-meteor-

      - name: Cache Meteor build
        id: cache-meteor-build
        uses: actions/cache@v4
        with:
          path: |
            .meteor/local/resolver-result-cache.json
            .meteor/local/plugin-cache
            .meteor/local/isopacks
            .meteor/local/bundler-cache/scanner
          key: v3-meteor_build_cache-${{ github.ref }}-${{ github.sha }}
          restore-key: |
            v3-meteor_build_cache-

      - name: Setup meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: '3.0.2'

      - name: Install NPM Dependencies
        run: cd src && meteor npm ci --legacy-peer-deps --force

      - name: Run Tests
        run: cd src && sh ./test.sh -c -o

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-javascript
          path: src/.coverage/.remap/cobertura.xml

  upload-coverage-javascript:
    name: Upload Backend Coverage
    needs: [tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-javascript

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: JavaScript
          label: code-coverage-agent

  docs:
    name: Backend Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - run: cd src && npm ci --legacy-peer-deps --force
      - run: cd src && npm run build:docs
