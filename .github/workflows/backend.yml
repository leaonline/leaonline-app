  docs:
    name: App Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - run: |
          cd src
          npm ci --legacy-peer-deps --force
          npm run build:docs
