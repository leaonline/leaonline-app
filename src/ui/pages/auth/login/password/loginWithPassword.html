<template name="loginWithPassword">
    <div class="row gap-4">
        <div class="col-12 col-lg-8 mx-auto">
            <input type="text"
                   class="form-control py-4 text-center lea-text-bold pw-input text-uppercase"
                   autofocus
                   style="letter-spacing: 0.4rem; font-size: 200%;">
        </div>


        <div class="col-12 col-lg-8 mx-auto">
            {{#if submitting}}
                {{> loading title=(i18n "auth.submitting")}}
            {{else}}
                {{> actionButton block=true outline=true label=(i18n "auth.submit") disabled=submitDisabled type="primary" btnClass="py-4 submit-btn"}}
            {{/if}}
        </div>
    </div>
</template>
