<template name="mapStageChooser">
    <div class="modal map-stage-chooser" tabindex="-1" aria-labelledby="{{titleId}}">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="{{titleId}}">{{i18n 'map.entry.title' value=stage.number}}</h2>
                    <button type="button" class="btn-close map-chooser-close" aria-label="{{i18n 'map.close'}}"></button>
                </div>
                <div class="modal-body" aria-busy="{{busy}}">
                    {{#if error}}<p class="alert alert-danger" role="alert">{{i18n error}}</p>{{/if}}
                    {{#if offline}}<p role="status">{{i18n 'map.offline'}}</p>{{/if}}
                    {{#if deciding}}
                        <p>{{i18n 'pages.map.decideContinue'}}</p>
                        <button type="button" class="btn btn-outline-primary map-decision" data-decision="restart">{{i18n 'common.restart'}}</button>
                        <button type="button" class="btn btn-primary map-decision" data-decision="continue">{{i18n 'common.continue'}}</button>
                        <button type="button" class="btn btn-outline-secondary map-decision" data-decision="cancel">{{i18n 'map.cancel'}}</button>
                    {{else}}
                        {{#if busy}}<p role="status">{{i18n 'map.loadingSession'}}</p>{{/if}}
                        {{#each choice in stage.choices}}
                            <button type="button" class="btn btn-outline-{{choice.dimension.color}} map-choice map-unitset w-100 mb-3" data-unitset="{{choice._id}}" disabled="{{disabled}}">
                                {{> mapChoiceSummary choice=choice}}
                            </button>
                        {{/each}}
                    {{/if}}
                </div>
            </div>
        </div>
    </div>
</template>

<template name="mapChoiceSummary">
    <span class="d-block">
        {{#if choice.dimension.icon}}{{> icon name=choice.dimension.icon}}{{/if}}
        {{choice.dimension.title}}
        {{#if choice.complete}} — {{i18n 'map.completed'}}{{/if}}
    </span>
    <span class="d-block">{{i18n 'map.pages'}}: {{pagePercent}}</span>
    <span class="d-block">{{i18n 'map.competencies'}}: {{competencyCount}}</span>
</template>
