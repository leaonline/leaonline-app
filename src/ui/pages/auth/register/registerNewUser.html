<template name="registerNewUser">
    {{#AuthContainer}}
    {{#onComplete complete=loadComplete}}

    {{#if accountStatus "decide"}}
        {{> textGroup text=(i18n "logins.new.account.thanks") class="text-secondary"}}
        {{> textGroup text=(i18n "logins.new.account.decide") class="text-secondary"}}

        <div class="card-body py-4 row row-gap-3">
            <div class="col text-center">
                {{#if accepted "terms"}}
                    {{> actionButton type="success" block=true label=(i18n "logins.new.account.accepted.terms") btnClass="py-4 legal-modal-btn" data-type="terms" icon="check"}}
                {{else}}
                    {{> actionButton type="primary" block=true label=(i18n "logins.new.account.open.terms") btnClass="py-4 legal-modal-btn" data-type="terms"}}
                {{/if}}
            </div>
            <div class="col text-center">
                {{#if accepted "privacy"}}
                    {{> actionButton type="success" block=true label=(i18n "logins.new.account.accepted.privacy") btnClass="py-4 legal-modal-btn" data-type="privacy" icon="check"}}
                {{else}}
                    {{> actionButton type="primary" block=true label=(i18n "logins.new.account.open.privacy") btnClass="py-4 legal-modal-btn" data-type="privacy"}}
                {{/if}}
            </div>
        </div>

        {{#if canRegister}}
        <div class="card-body py-4 row row-gap-3">
            {{> actionButton type="primary" label=(i18n "logins.new.account.register") btnClass="py-4 register-btn" block=true lg=true}}
        </div>
        {{/if}}

    {{/if}}
    {{#if accountStatus "creating"}}
    <div class="card-body border border-primary rounded p-2 d-flex justify-content-start align-items-center gap-3">
        {{> icon name="user" fw=true class="text-primary"}}
        {{> textGroup text=(i18n "logins.new.account.creating") class="text-secondary"}}
        {{> icon name="spinner" pulse=true fw=true class="ms-auto bg-primary rounded-pill px-1 text-white"}}
    </div>
    {{/if}}
    {{#if accountStatus "created"}}
    <div class="card-body border border-success rounded p-2 d-flex justify-content-start align-items-center gap-3">
        {{> icon name="user" fw=true class="text-success"}}
        {{> textGroup text=(i18n "logins.new.account.created") class="text-secondary"}}
        {{> icon name="check" fw=true class="ms-auto bg-success rounded-pill px-1 text-white"}}
    </div>
    {{/if}}
    {{/onComplete}}
    {{/AuthContainer}}

    {{#modal id="legal-modal" xl=true static=true}}
        {{> modalheader dismiss=true class="bg-primary text-white" title=(i18n legal.title)}}
        {{#modalbody}}
            {{#if legal}}
                {{{legal.text}}}
            {{else}}
                {{> loading }}
            {{/if}}
        {{/modalbody}}
        {{#modalfooter}}
            {{#if legal}}
            <div class="w-100 d-flex justify-content-between align-items-center">
                {{> actionButton type="secondary" label=(i18n "actions.cancel") data-bs-dismiss="modal"}}
                {{> actionButton type="primary" label=(i18n "logins.new.account.accept") btnClass="legal-accept-btn" data-type=legal.name }}
            </div>
            {{/if}}
        {{/modalfooter}}
    {{/modal}}
</template>
