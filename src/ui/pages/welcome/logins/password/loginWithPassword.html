<template name="loginWithPassword">
    <input type="text" class="form-control py-4 text-center lea-text-bold pw-input text-uppercase" autofocus style="letter-spacing: 0.4rem; font-size: 200%;">

    <div class="mt-4 row">
        <div class="col-12 col-lg-6">
            {{> actionButton btnClass="w-100" label=(i18n "logins.password.forgot")}}
        </div>
        <div class="col-12 col-lg-6">
            {{> actionButton btnClass="w-100" label=(i18n "logins.password.new")}}
        </div>
    </div>
</template>
