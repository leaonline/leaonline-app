<template name="welcome">
    <div class="w-100 lea-welcome-container">
        {{#unless loadComplete}}
            {{> loading}}
        {{/unless}}

        <div class="w-100">
            <div class="container intro-video-container">
                {{> image
                        src=(fullUrl "/logo/welcome-1110x409.png")
                        alt="image welcome"
                        class="rounded lea-main-logo shadow"}}
            </div>
        </div>

        {{! we need to show a beta version warning in order to inform users }}
        {{#if isBeta}}
            {{#onComplete complete=dependenciesComplete}}
                {{#container class="welcome-intro-container my-5"}}
                    <div class="card">
                        <div class="card-header beta-header border border-primary bg-white d-flex justify-content-between">
                            {{#unless betaMessageOpen}}
                                {{> actionButton
                                        btnClass="btn-primary bg-primary text-white"
                                        type="primary"
                                        class="toggle-beta"
                                        label=(i18n "actions.show")}}
                            {{else}}
                                {{> actionButton
                                        btnClass="btn-primary bg-primary text-white"
                                        type="primary"
                                        class="toggle-beta"
                                        label=(i18n "actions.hide")}}
                            {{/unless}}
                        </div>
                        <div class="card-body beta-content border border-primary" style="display: none;">
                            {{> textGroup type=this.type text=(i18n "pages.welcome.beta.note")}}
                        </div>
                    </div>
                {{/container}}
            {{/onComplete}}
        {{/if}}

        {{#unless currentUser}}
            {{#container class="welcome-intro-container my-5"}}
                {{#unless currentLogin}}
                <div class="card bg-white lea-login-list-card">
                    <div class="card-body bg-white">
                        {{#onComplete complete=dependenciesComplete}}
                            {{> textGroup text=(i18n "pages.welcome.introduction")}}
                        {{/onComplete}}
                    </div>

                    <div class="card-body py-4 d-flex justify-content-center gap-4">
                        {{#onComplete complete=dependenciesComplete}}
                            {{> routeButton
                                    href=(route "register")
                                    block=true
                                    lg=true
                                    outline=true
                                    type="primary"
                                    label=(i18n "pages.welcome.iAmNew")
                                    btnClass="py-4"
                                    iconPos="right"
                                    icon="rocket" }}

                            {{> routeButton
                                href=(route "login")
                                block=true
                                lg=true
                                outline=true
                                type="secondary"
                                label=(i18n "pages.welcome.iCanLogin")
                                btnClass="py-4"
                                iconPos="right"
                                icon="lock-open" }}
                        {{/onComplete}}
                    </div>
                </div>
                {{/unless}}

                {{#with currentLogin}}

                    <div class="card bg-white mt-3 mt-lg-5 lea-login-method-card">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            {{> actionButton
                                    block=true
                                    sm=true
                                    outline=true
                                    tts=(i18n "common.back")
                                    btnClass="lea-cancel-login-btn"
                                    icon="arrow-left"
                            }}
                            <div class="d-flex gap-2 align-items-center">
                            {{> soundbutton
                                    tts=this.tts
                                    text=null
                                    outline=true
                                    class="border-0"
                                    sm=true
                                    type='secondary'
                            }}
                            <div class=" d-flex justify-content-center align-items-baseline">
                                <span class="lea-text-bold me-2">
                                    {{i18n this.label}}
                                </span>
                                {{> icon name=this.icon fw=true class="text-secondary"}}
                            </div>
                            </div>
                        </div>
                        <div class="card-body">
                            {{#onComplete complete=loginTemplateLoaded}}
                                {{> Template.dynamic template=this.template data=(loginTemplateData this)}}
                            {{/onComplete}}
                        </div>
                    </div>
                {{/with}}
            {{/container}}
        {{/unless}}
    </div>
</template>
