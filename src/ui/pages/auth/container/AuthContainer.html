<template name="AuthContainer">
    <div class="container">
        <div class="lea-auth-container p-4 bg-white h-auto mt-4 shadow">
            {{> Template.contentBlock }}
        </div>
        {{#unless currentUser}}
        <div class="card-body my-4 py-4 gap-4 d-flex justify-content-center">
                {{#each authRoute in authRoutes}}
                    {{#unless isCurrent authRoute.name}}
                        {{> routeButton
                            href=(route authRoute.name)
                            type="secondary"
                            label=(i18n authRoute.label)
                            outline=true sm=true
                            iconPos="right"
                            icon=authRoute.icon}}
                        {{/unless}}
                    {{/each}}
        </div>
        {{/unless}}
    </div>
</template>
