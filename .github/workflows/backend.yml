name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  code-quality: write

jobs:
  lintcode:
    name: App JS lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - run: |
          cd src
          npm ci --legacy-peer-deps --force
          npm run lint:code
          npm run format:code

  tests:
    name: App Meteor Tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Checkout leaonline:corelib repo
        uses: actions/checkout@v7
        with:
          repository: leaonline/corelib
          path: src/packages/corelib

      - name: Checkout leaonline:ui repo
        uses: actions/checkout@v7
        with:
          repository: leaonline/ui
          path: src/packages/ui

      - name: Checkout leaonline:service-registry repo
        uses: actions/checkout@v7
        with:
          repository: leaonline/service-registry
          path: src/packages/service-registry

      # CACHING
      - name: Install Meteor
        id: cache-meteor-install
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: v3-meteor-${{ hashFiles('src/.meteor/versions') }}
          restore-keys: |
            v3-meteor-

      - name: Cache Meteor build
        id: cache-meteor-build
        uses: actions/cache@v4
        with:
          path: |
            src/.meteor/local/resolver-result-cache.json
            src/.meteor/local/plugin-cache
            src/.meteor/local/isopacks
            src/.meteor/local/bundler-cache/scanner
          key: v3-meteor_build_cache-${{ github.ref }}-${{ github.sha }}
          restore-key: |
            v3-meteor_build_cache-

      - name: Setup meteor
        uses: meteorengineer/setup-meteor@v2
        with:
          meteor-release: '3.4'

      - name: Install NPM Dependencies
        run: |
          cd src
          meteor npm ci --legacy-peer-deps --force

      - name: Run Tests
        run: |
          cd src
          sh ./test.sh -c -o

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            src/.coverage/

